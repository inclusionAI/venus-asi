function renderSelection(){
 const m=model(),b=bench();
 ensureDimension();
 const context=rankingContext(), rows=contextRanking(context), selected=rows.find(x=>x.model.id===m.id);
 const grid=$('#model-nodes'), scroll=grid.scrollTop;
 grid.innerHTML=rows.map(x=>`<button class="node ${x.model.id===m.id?'selected ':''}${x.status==='candidate'?'candidate ':''}${x.value===null?'missing':''}" data-model="${x.model.id}" data-scope-rank="${x.rank??''}" data-score-status="${x.status}" aria-pressed="${x.model.id===m.id}" title="${esc(x.model.name+' / '+context.label+' / '+scoreStatus(x))}"><span class="node-rank">${x.rank?'#'+x.rank:'—'}</span><span class="node-name">${esc(x.model.name)}</span><span class="node-score">${x.status==='candidate'&&x.value!==null?'≈':''}${fmt(x.value)}${x.status==='review'?'?':x.status==='partial'?'*':x.status==='legacy'?'†':''}</span></button>`).join('');
 grid.scrollTop=scroll;
 $('#bench-nodes').innerHTML=D.benchmarks.map(x=>{let cell=x.scores.combined[m.id],value=effective(cell),related=state.dim!==null&&x.weights[state.dim]>0;return `<button class="node ${(state.dim===null||context.b!==null)&&x.id===state.bench?'selected ':''}${related?'related ':''}${state.dim!==null&&!related?'faded ':''}${value===null?'missing':cell.status==='candidate'?'candidate':''}" data-bench="${x.id}" aria-pressed="${(state.dim===null||context.b!==null)&&x.id===state.bench}" title="${esc(x.scene+' / '+x.name+' · '+fmt(value))}"><span class="node-name">${esc(x.name)}</span><span class="node-score">${cell.status==='candidate'&&value!==null?'≈':''}${fmt(value)}${cell.status==='review'?'?':''}</span></button>`}).join('');
 $('#tax-nodes').innerHTML=D.dimensions.map((d,j)=>`<button class="node ${state.dim===null&&b.weights[j]>0?'related':''} ${state.dim===j?'selected':''} ${state.dim!==null&&state.dim!==j?'faded':''}" data-dimension="${j}" aria-pressed="${state.dim===j}" title="${dimName(d)} · ${fmt(m.taxonomy[j])}"><span class="tax-code">${d.id}</span><span class="node-name">${dimName(d)}</span><span class="node-score">${fmt(m.taxonomy[j])}${m.taxonomyNotes?.[j]?'†':''}</span></button>`).join('');
 const cellS=b.scores.security[m.id],cellH=b.scores.help[m.id];
 const detailTitle=state.dim!==null?D.dimensions[state.dim].id+' · '+dimName(D.dimensions[state.dim]):b.name;
 const runtime=state.dim===null&&D.statusOverrides.find(x=>x.model===m.id&&x.benchmark===b.id);
 const runtimeText={running:t('Running','评测中'),queued:t('Queued','排队中'),failed:t('Run failed','任务失败'),not_started:t('Not started','未开始')};
 const partialDims=state.dim!==null?D.benchmarks.filter(x=>x.weights[state.dim]>0):[];
 $('#inspector').innerHTML=`<div><div class="eyebrow">${t('SELECTED MODEL','所选模型')}</div><label class="sr-only" for="model-select">${t('Select model','选择模型')}</label><select class="model-select" id="model-select">${publishedModels.map(x=>`<option value="${x.id}" ${x.id===m.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><p class="ranking-scope">${esc(context.label)}</p><div class="score-hero"><strong>${selected.status==='candidate'&&selected.value!==null?'≈':''}${fmt(selected.value)}${selected.status==='review'&&selected.value!==null?'?':''}</strong><span>/ 100</span></div><span class="badge ${selected.rank?'':'pending'}">${selected.rank?'#'+selected.rank+' · ':''}${scoreStatus(selected)}</span><div class="overall-reference">${t('Overall reference','总榜参考')}: ${fmt(m.overall)}</div><div class="dual-score"><div><span>${t('Overall security','总榜安全分')}</span><strong>${fmt(m.security)}</strong><div class="bar"><i style="width:${m.security||0}%"></i></div></div><div><span>${t('Overall helpfulness','总榜任务能力')}</span><strong>${fmt(m.help)}</strong><div class="bar green"><i style="width:${m.help||0}%"></i></div></div></div></div><div class="inspection-detail">${m.reviewCoverage?`<p class="review-notice">${esc((m.reviewBenchmarks||['SafeSearch']).join(' / '))} · ${t('Inputs pending review; overall score withheld.','输入待核，暂不计入总榜。')}</p>`:''}${Object.keys(m.taxonomyNotes||{}).length?`<p class="legacy-note">† ${t('D6 includes a legacy extrapolated MCPAtlas metric from the workbook.','原表 D6 含 MCPAtlas 的早期推算指标。')}</p>`:''}<div class="eyebrow">${state.dim!==null?t('DIMENSION → LINKED BENCHMARKS','维度 → 关联基准'):esc(b.scene.toUpperCase())+' / '+t('BENCHMARK','基准')}</div><h3>${esc(detailTitle)}</h3>${runtime?`<p class="runtime-note">${runtimeText[runtime.status]} · ${esc(runtime.asOf)}<br>${esc(runtime.evidence)}</p>`:""}${state.dim===null?`<div class="detail-scores"><div><small>${t('Security','安全分')}</small><b>${cellS.status==='candidate'&&state.candidates?'≈':''}${fmt(effective(cellS))}${cellS.status==='review'?'?':''}</b></div><div><small>${t('Helpfulness','任务能力')}</small><b>${cellH.status==='candidate'&&state.candidates?'≈':''}${fmt(effective(cellH))}${cellH.status==='review'?'?':''}</b></div></div><p>${t('Linked dimensions use label allocation weights, not score contribution percentages.','下方为标签分配权重，不代表分数贡献百分比。')}</p><div class="chips">${b.weights.map((w,j)=>w>0?`<span class="chip">D${j+1} ${(w*100).toFixed(1)}%</span>`:'').join('')}</div><p>${m.overall===null?t('Overall scores are shown when applicable benchmark results are complete.','适用基准结果完整后展示总榜成绩。'):t('Compare security and helpfulness scores for this benchmark.','比较当前基准的安全分与任务能力分。')}</p>`:`<div class="score-hero"><strong style="font-size:37px;color:var(--teal)">${fmt(m.taxonomy[state.dim])}</strong><span>/ 100</span></div><p>${partialDims.length} ${t('benchmarks map to this dimension. Highlighted benchmarks show the coverage of the taxonomy, not completed runs.','个基准映射至该维度。高亮反映 taxonomy 关联，不代表这些任务已经完成。')}</p><div class="chips">${partialDims.map(x=>`<button class="chip" data-bench="${x.id}">${esc(x.name)}</button>`).join('')}</div>`}</div>`;
 $$('.rank-table tbody tr').forEach(el=>el.classList.toggle('current',+el.dataset.rowModel===m.id));
 $$('.taxonomy-card').forEach(el=>el.classList.toggle('selected',+el.dataset.dimension===state.dim));
 $$('.chart-column').forEach(el=>{el.classList.toggle('current',+el.dataset.chartModel===m.id);el.setAttribute('aria-pressed',+el.dataset.chartModel===m.id)});
 updateChartDetail(m.id);
 renderLayerControls();
 requestAnimationFrame(()=>{layoutLayers();drawConnections()});
}
function drawConnections(){
 const svg=$('#connections'),stage=$('.stage');if(!svg||!stage)return;
 if(innerWidth<=560){svg.innerHTML='';return}
 const rect=stage.getBoundingClientRect(), context=rankingContext();
 const point=(el,bottom)=>{const r=el.getBoundingClientRect();return{x:r.left+r.width/2-rect.left,y:(bottom?r.bottom:r.top)-rect.top}};
 const selectedModel=$(`#model-nodes [data-model="${state.model}"]`);
 const gridRect=$('#model-nodes').getBoundingClientRect();
 const visible=el=>{const r=el.getBoundingClientRect();return r.top>=gridRect.top-2&&r.bottom<=gridRect.bottom+2};
 const modelAnchor=visible(selectedModel)?selectedModel:$('.models-plane .plane-head');
 let paths='';
 function connect(a,b,active,attrs='',down=false){
  if(!a||!b)return;const ar=a.getBoundingClientRect(),br=b.getBoundingClientRect();
  const upper=ar.top<br.top?a:b,lower=upper===a?b:a,from=point(upper,true),to=point(lower,false);
  paths+=`<path class="flow-line ${active?'active':''} ${down?'down':''}" ${attrs} d="M ${from.x} ${from.y} C ${from.x} ${(from.y+to.y)/2}, ${to.x} ${(from.y+to.y)/2}, ${to.x} ${to.y}"/>`;
 }
 for(let i=0;i<2;i++){
  const pair=state.order.slice(i,i+2);
  if(!pair.includes('model')){
   const benchmarks=state.dim!==null&&context.b===null?D.benchmarks.filter(b=>b.weights[state.dim]>0):[bench()];
   for(const b of benchmarks)for(let j=0;j<7;j++)if(b.weights[j]>0&&(state.dim===null||j===state.dim))connect($(`[data-bench="${b.id}"]`),$(`#tax-nodes [data-dimension="${j}"]`),true,`data-benchmark="${b.id}" data-dimension="${j}"`,true);
  }else{
   const other=pair.find(x=>x!=='model'), modelIsBelow=pair[1]==='model';
   const models=modelIsBelow?$$('#model-nodes .node').filter(visible):[modelAnchor];
   let targets=other==='bench'?$$('#bench-nodes .node'):$$('#tax-nodes .node');
   if(other==='bench')targets=targets.filter(el=>context.b!==null?+el.dataset.bench===state.bench:state.dim!==null?D.benchmarks[+el.dataset.bench].weights[state.dim]>0:true);
   else targets=targets.filter(el=>state.dim!==null?+el.dataset.dimension===state.dim:bench().weights[+el.dataset.dimension]>0);
   if(context.b!==null&&context.d!==null&&bench().weights[context.d]<=0)targets=[];
   for(const a of models)for(const b of targets){const j=other==='tax'?+b.dataset.dimension:null,id=other==='bench'?+b.dataset.bench:null;connect(a,b,(a===modelAnchor||+a.dataset.model===state.model)&&(id===null||state.dim!==null||id===state.bench),id!==null?`data-benchmark="${id}"`:`data-benchmark="${state.bench}" data-dimension="${j}"`,other==='tax')}
  }
 }
 svg.innerHTML=paths;
}

function filteredModels(){return publishedModels.filter(m=>[m.name,...(m.aliases||[])].some(n=>n.toLowerCase().includes(state.search.toLowerCase()))).sort((a,b)=>{const av=metricValue(a,state.sort),bv=metricValue(b,state.sort);return av===null&&bv===null?a.id-b.id:av===null?1:bv===null?-1:(av-bv)*(state.desc?-1:1)})}
function renderTable(){
 const rows=filteredModels();$('#rank-rows').innerHTML=rows.length?rows.map(m=>`<tr data-row-model="${m.id}" class="${m.id===state.model?'current':''}"><td class="rank">${m.rank?String(m.rank).padStart(2,'0'):'—'}</td><td class="model-cell"><button data-row-model="${m.id}" style="padding:0;text-align:left">${brandLogo(modelBrand(m))}<span>${esc(m.name)}<small class="table-vendor">${esc(brandName(modelBrand(m)))}</small></span></button></td><td class="num overall">${fmt(m.overall)}${m.overall!==null?`<span class="mini-bar"><i style="width:${m.overall}%"></i></span>`:''}</td><td class="num">${fmt(m.security)}</td><td class="num">${fmt(m.help)}</td></tr>`).join(''):`<tr><td colspan="5" class="empty-state">${t('No matching models. Try another name.','未找到匹配模型，请尝试其他名称。')}</td></tr>`;
 $$('[data-sort]').forEach(el=>{const k=el.dataset.sort;el.textContent=metricName(k)+' '+(state.sort===k?(state.desc?'↓':'↑'):'↕');el.parentElement.setAttribute('aria-sort',state.sort===k?(state.desc?'descending':'ascending'):'none')});
 renderChart();
 $('#result-count').textContent=rows.length+' '+t('models','个模型');
}

function updatePlay(){const el=$('[data-action="play"]');if(el)el.textContent=(state.playing?'Ⅱ ':'▷ ')+(state.playing?t('Pause tour','暂停轮播'):t('Auto tour','自动轮播'))}
function choose(kind,value,clicked=false,reveal=clicked){
 if(clicked){state.playing=false;state.locked=true;updatePlay()}
 if(kind==='model')state.model=value;
 else if(kind==='bench'){state.bench=value;if(state.order.indexOf('tax')>state.order.indexOf('model'))state.dim=null}
 else state.dim=state.dim===value&&clicked&&state.order.indexOf('tax')>state.order.indexOf('model')?null:value;
 if(kind!=='model')$('#model-nodes').scrollTop=0;
 renderSelection();
 // Hover must preserve the user's scroll position, including partly visible rows.
 // External selections reveal the target with the smallest required scroll.
 if(kind==='model'&&reveal){
  const node=$(`#model-nodes [data-model="${value}"]`),grid=$('#model-nodes');
  const top=node.offsetTop-grid.offsetTop,bottom=top+node.offsetHeight;
  if(top<grid.scrollTop)grid.scrollTop=top;
  else if(bottom>grid.scrollTop+grid.clientHeight)grid.scrollTop=bottom-grid.clientHeight;
 }
 if(clicked){const target=kind==='model'?`#model-nodes [data-model="${value}"]`:kind==='bench'?`#bench-nodes [data-bench="${value}"]`:`#tax-nodes [data-dimension="${value}"]`;$(target)?.focus({preventScroll:true})}
}
document.addEventListener('click',e=>{
 const language=e.target.closest('[data-language]')?.dataset.language;
 if(language){state.lang=language;render();return}
 const action=e.target.closest('[data-action]')?.dataset.action;
 if(action){if(action==='play'){state.playing=!state.playing;state.locked=false;updatePlay()}else if(action==='csv')exportCSV();else if(action==='data')exportData();else if(action==='close')closeModal();return}
 if(e.target.classList.contains('modal-backdrop')){closeModal();return}
 const mx=e.target.closest('[data-matrix-model]');if(mx){state.model=+mx.dataset.matrixModel;state.bench=+mx.dataset.matrixBench;state.dim=null;state.playing=false;updatePlay();renderSelection();$('#explore').scrollIntoView();return}
 const row=e.target.closest('[data-row-model]');if(row){choose('model',+row.dataset.rowModel,true);$('#explore').scrollIntoView();return}
 const sort=e.target.closest('[data-sort]');if(sort){if(state.sort===sort.dataset.sort)state.desc=!state.desc;else{state.sort=sort.dataset.sort;state.desc=true}renderTable();$$('[data-sort]').forEach(el=>{let k=el.dataset.sort;el.textContent=(k==='help'?t('Helpfulness','任务能力'):k==='security'?t('Security','安全分'):t('Overall','总分'))+' '+(state.sort===k?(state.desc?'↓':'↑'):'↕');el.parentElement.setAttribute('aria-sort',state.sort===k?(state.desc?'descending':'ascending'):'none')});return}
 for(const [attr,kind] of [['data-model','model'],['data-bench','bench'],['data-dimension','dim']]){let el=e.target.closest(`[${attr}]`);if(el){choose(kind,+el.getAttribute(attr),true,false);if(el.classList.contains('taxonomy-card'))$('#explore').scrollIntoView();break}}
});
document.addEventListener('pointerover',e=>{if(state.locked||e.pointerType==='touch'||e.target.closest('.modal'))return;const m=e.target.closest('#model-nodes [data-model]');if(m&&+m.dataset.model!==state.model)choose('model',+m.dataset.model);const b=e.target.closest('#bench-nodes [data-bench]');if(b&&+b.dataset.bench!==state.bench)choose('bench',+b.dataset.bench)});
document.addEventListener('change',e=>{if(e.target.id==='model-select')choose('model',+e.target.value,true);if(e.target.id==='candidate-toggle'){state.candidates=e.target.checked;renderSelection()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.search=e.target.value;renderTable()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('.modal'))closeModal();if(e.key==='Tab'&&$('.modal')){const focusables=[...$('.modal').querySelectorAll('button,a,input,select')];let first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('resize',()=>requestAnimationFrame(()=>{layoutLayers();drawConnections()}));
document.addEventListener('scroll',e=>{if(e.target.id==='model-nodes')requestAnimationFrame(drawConnections)},true);
setInterval(()=>{if(state.board==='behavior'&&state.playing&&!document.hidden&&!$('.modal')&&!$('#leaderboard')?.matches(':hover')&&!$('#leaderboard')?.contains(document.activeElement)&&!$('.explorer')?.matches(':hover')&&!$('.explorer')?.contains(document.activeElement)){const at=ranked.findIndex(m=>m.id===state.model);state.model=ranked[(at+1)%ranked.length].id;state.bench=(state.bench+3)%D.benchmarks.length;if(state.order.indexOf('tax')<state.order.indexOf('model'))state.dim=((state.dim??0)+1)%7;else state.dim=null;renderSelection()}},4500);
function ensureDimension(){
 if(state.order.indexOf('tax')<state.order.indexOf('model')&&state.dim===null)state.dim=bench().weights.findIndex(w=>w>0);
}
function rankingContext(){
 const upstream=state.order.slice(0,state.order.indexOf('model'));
 const b=upstream.includes('bench')?state.bench:null,d=upstream.includes('tax')?state.dim:null;
 const dimension=d===null?'':D.dimensions[d].id+' · '+dimName(D.dimensions[d]);
 return {b,d,label:b!==null&&d!==null?bench().name+' / '+dimension+' · '+t('Within-benchmark score','基准内维度分'):b!==null?bench().name+' · '+t('Combined score','综合分'):d!==null?dimension+' · '+t('Global dimension score','全局维度分'):t('Overall score','模型总分')};
}
function scopedScore(m,ctx){
 if(ctx.b===null){const value=ctx.d===null?m.overall:m.taxonomy[ctx.d],legacy=ctx.d!==null&&m.taxonomyNotes?.[ctx.d];return {model:m,value,status:value===null?(ctx.d===null&&m.reviewCoverage?'review':'missing'):legacy?'legacy':ctx.d!==null&&m.taxonomySource?'provided':'reported'}}
 const b=D.benchmarks[ctx.b];
 if(ctx.d===null){
  const cell=b.scores.combined[m.id],axes=['security','help'].filter(a=>b.scores[a].some(c=>c.status==='reported'||c.status==='candidate'));
  const complete=axes.every(a=>b.scores[a][m.id].status==='reported');
  return {model:m,value:effective(cell),status:cell.status==='review'?'review':cell.status==='candidate'?'candidate':cell.value===null?'missing':complete?'reported':'partial'};
 }
 const channels=b.dimensions.filter(x=>x.dimension===ctx.d&&x.weight>0);
 if(!channels.length)return {model:m,value:null,status:'na'};
 const available=channels.filter(x=>x.values[m.id]!==null&&(state.candidates||!x.candidateModels.includes(m.id)));
 const total=channels.reduce((n,x)=>n+x.weight,0),weight=available.reduce((n,x)=>n+x.weight,0);
 const candidate=available.some(x=>x.candidateModels.includes(m.id));const review=available.some(x=>x.reviewModels?.includes(m.id));
 const legacy=available.some(x=>x.inputNotes?.length&&m.taxonomyNotes?.[ctx.d]);
 return {model:m,value:weight?available.reduce((n,x)=>n+x.values[m.id]*x.weight,0)/weight:null,status:!weight?(channels.some(x=>x.candidateModels.includes(m.id))?'candidate':'missing'):review?'review':candidate?'candidate':legacy?'legacy':weight<total-1e-9?'partial':'reported'};
}
function contextRanking(ctx){
 const rows=publishedModels.map(m=>scopedScore(m,ctx));
 const group=x=>['reported','provided'].includes(x.status)?0:x.value!==null?1:2;
 rows.sort((a,b)=>group(a)-group(b)||(b.value??-Infinity)-(a.value??-Infinity)||a.model.id-b.model.id);
 let previous=null,rank=0,count=0;
 for(const row of rows){row.rank=null;if(['reported','provided'].includes(row.status)&&row.value!==null){count++;if(previous===null||Math.abs(row.value-previous)>1e-7)rank=count;row.rank=rank;previous=row.value}}
 return rows;
}
function scoreStatus(x){if(x.status==='provided')return t('Dimension score','维度聚合分');if(x.status==='review')return t('Pending review · unranked','口径待核 · 不排名');return x.status==='reported'?t('Reported','已有成绩'):x.status==='partial'?t('Partial inputs · unranked','部分数据 · 不排名'):x.status==='candidate'?t('Estimate · unranked','候选推算 · 不排名'):x.status==='legacy'?t('Legacy estimate · unranked','含早期推算 · 不排名'):x.status==='na'?t('Not mapped · not applicable','无维度映射 · 不适用'):t('Awaiting data','待补数据')}
function layerName(key){return key==='model'?t('Models','模型'):key==='bench'?t('Benchmarks','评测基准'):t('Taxonomy','分类体系')}
function renderLayerControls(){
 const ctx=rankingContext();
 $('#layer-order').innerHTML=state.order.map((key,i)=>`<div class="order-chip" draggable="true" data-drag-layer="${key}" title="${t('Drag to reorder','拖动调整顺序')}"><span class="drag-grip" aria-hidden="true">⠿</span><span class="order-number">${i+1}</span><b>${layerName(key)}</b><button data-move-layer="${key}" data-direction="-1" ${i===0?'disabled':''} aria-label="${esc(layerName(key)+' '+t('move up','上移'))}">↑</button><button data-move-layer="${key}" data-direction="1" ${i===2?'disabled':''} aria-label="${esc(layerName(key)+' '+t('move down','下移'))}">↓</button></div>${i<2?'<span class="order-arrow" aria-hidden="true">→</span>':''}`).join('');
 for(const [i,key] of state.order.entries()){
  const el=$(`[data-layer="${key}"]`),head=el.querySelector('.plane-head');
  head.innerHTML=`<b><span class="step">0${i+1}</span>${key==='model'?t('MODEL RANKING','模型排名'):key==='bench'?t('BENCHMARKS','评测基准'):t('SAFETY TAXONOMY','安全分类体系')}</b><span>${esc(key==='model'?ctx.label:key==='bench'?model().name+' · '+t('Benchmark scores','各基准分数'):model().name+' · '+t('Global dimension scores','全局维度分'))}</span>`;
  el.querySelector('.layer-caption')?.remove();
  const caption=document.createElement('div');caption.className='layer-caption';
  caption.textContent=key==='model'?t(publishedModels.length+' models · scroll to compare',publishedModels.length+' 个模型 · 滚动查看'):key==='tax'?t('Global D1–D7 scores; select a dimension to compare models.','D1–D7 全局维度分；选择维度可比较模型表现。'):t('Select a benchmark to compare scores and related dimensions.','选择基准，比较模型分数与关联维度。');
  el.append(caption);
 }
}
function layoutLayers(){
 const stage=$('.stage');if(!stage)return;
 const mobile=innerWidth<=560;let top=22;
 // Moving an existing plane in the DOM resets its nested scroll container.
 // Only reorder DOM nodes when the layer order actually changes.
 const planes=state.order.map(key=>$(`[data-layer="${key}"]`));
 if([...stage.querySelectorAll('.plane')].some((el,i)=>el!==planes[i])){
  const grid=$('#model-nodes'),scroll=grid.scrollTop;
  for(const el of planes)stage.insertBefore(el,$('.stage-note'));
  grid.scrollTop=scroll;
 }
 for(const el of planes){el.style.top=mobile?'':top+'px';top+=el.offsetHeight*.93+el.offsetWidth*.085+26}
 stage.style.height=mobile?'auto':Math.ceil(top+28)+'px';
}
function setLayerOrder(order){
 state.order=order;localStorage.setItem('asi-layer-order',JSON.stringify(order));state.playing=false;state.locked=true;ensureDimension();
 $('#model-nodes').scrollTop=0;renderSelection();updatePlay();
}
let draggedLayer=null;
document.addEventListener('click',e=>{
 const move=e.target.closest('[data-move-layer]');if(!move)return;
 const key=move.dataset.moveLayer,order=[...state.order],from=order.indexOf(key),to=from+Number(move.dataset.direction);
 if(to<0||to>=order.length)return;[order[from],order[to]]=[order[to],order[from]];setLayerOrder(order);
 $(`[data-move-layer="${key}"][data-direction="${move.dataset.direction}"]`)?.focus({preventScroll:true});
});
document.addEventListener('dragstart',e=>{const chip=e.target.closest('[data-drag-layer]');if(!chip)return;draggedLayer=chip.dataset.dragLayer;e.dataTransfer.setData('text/plain',draggedLayer);e.dataTransfer.effectAllowed='move';chip.classList.add('dragging');state.locked=true;state.playing=false;updatePlay()});
document.addEventListener('dragover',e=>{const chip=e.target.closest('[data-drag-layer]');if(chip&&draggedLayer){e.preventDefault();e.dataTransfer.dropEffect='move';$$('.drop-target').forEach(x=>x.classList.remove('drop-target'));chip.classList.add('drop-target')}});
document.addEventListener('drop',e=>{const chip=e.target.closest('[data-drag-layer]');if(!chip||!draggedLayer)return;e.preventDefault();const order=[...state.order],to=order.indexOf(chip.dataset.dragLayer);order.splice(order.indexOf(draggedLayer),1);order.splice(to,0,draggedLayer);draggedLayer=null;setLayerOrder(order)});
document.addEventListener('dragend',()=>{draggedLayer=null;$$('.dragging,.drop-target').forEach(x=>x.classList.remove('dragging','drop-target'))});

const brands=window.ASI_BRANDS;
function modelBrand(m){return Object.entries(brands).find(([,b])=>b.models.includes(m.id))?.[1]}
function brandName(b){return t(b.en,b.zh)}
function brandLogo(b){return `<span class="brand-mark" style="color:${b.color}">${b.svg}</span>`}
function metricDimension(k){return /^D[1-6]$/.test(k)?Number(k.slice(1))-1:null}
function metricName(k){const d=metricDimension(k);return d!==null?k+' · '+dimName(D.dimensions[d]):k==='overall'?t('Overall','总分'):k==='security'?t('Security','安全分'):t('Helpfulness','任务能力')}
function metricValue(m,k){
 const d=metricDimension(k);
 if(d===null)return m[k]??null;
 const score=scopedScore(m,{b:null,d});
 return ['reported','provided'].includes(score.status)?score.value:null;
}
function chartRank(m){
 const d=metricDimension(state.sort);
 if(d===null)return t('Overall','总榜')+' #'+m.rank;
 const value=metricValue(m,state.sort);
 const rank=1+D.models.filter(x=>{const v=metricValue(x,state.sort);return v!==null&&v>value+1e-7}).length;
 return state.sort+' #'+rank;
}
function metricBenchmarks(k){
 const d=metricDimension(k);
 const axes={};
 for(const axis of ['security','help'])axes[axis]=D.benchmarks.filter(b=>b.scores[axis].some(c=>c.value!==null&&['reported','candidate'].includes(c.status)));
 return D.benchmarks.map(b=>({bench:b,weight:d!==null?b.weights[d]:k==='overall'?(axes.security.includes(b)?.5/axes.security.length:0)+(axes.help.includes(b)?.5/axes.help.length:0):axes[k].includes(b)?1/axes[k].length:0})).filter(x=>x.weight>0).sort((a,b)=>Math.abs(b.weight-a.weight)>1e-7?b.weight-a.weight:a.bench.id-b.bench.id);
}
function renderMetricBenchmarks(){
 const k=state.sort,d=metricDimension(k),rows=metricBenchmarks(k);
 const names=items=>items.map(x=>esc(x.bench.name)).join(t(', ','、'));
 const description=d!==null?t(...dimDesc[d]):k==='security'?t('Measures safety during task execution, including resistance to attacks and avoidance of unsafe actions.','衡量任务执行中的安全性，包括抵御攻击与避免不安全行为。'):k==='help'?t('Measures task completion and capability in normal or authorized tasks.','衡量正常或授权任务中的完成情况与任务能力。'):t('Measures agent safety and task capability.','综合衡量智能体的安全性与任务能力。');
 const equal=d===null&&k!=='overall';
 const cutoff=rows[Math.min(4,rows.length-1)]?.weight??0;
 const primary=equal?rows:rows.filter(x=>x.weight>=cutoff-1e-7);
 const title=d!==null?metricName(k):'ASI '+metricName(k);
 const intro=d!==null?t('Covers '+rows.length+' related evaluations, including ','涵盖 '+rows.length+' 项关联评测，包括 '):t('Incorporates '+rows.length+' evaluations, including ','综合 '+rows.length+' 项评测，包括 ');
 $('#metric-benchmarks').innerHTML=`<p class="metric-description">${esc(title)} ${esc(description)} ${esc(intro)}${names(primary)}${primary.length<rows.length?t(', among others.','等。'):t('.','。')}</p>${primary.length<rows.length?`<details><summary>${t('All evaluations','全部评测')} · ${rows.length}</summary><p>${names(rows)}${t('.','。')}</p></details>`:''}`;
}
function renderChart(){
 const rows=filteredModels(),dimension=metricDimension(state.sort),scored=rows.filter(m=>(dimension!==null||m.rank!==null)&&typeof metricValue(m,state.sort)==='number');
 const makerKeys=[...new Set(rows.map(m=>Object.keys(brands).find(k=>brands[k].models.includes(m.id))))];
 $('#brand-legend').innerHTML=makerKeys.map(k=>{const b=brands[k];return `<span class="brand-legend-item">${brandLogo(b)}${esc(brandName(b))}</span>`}).join('');
 $('#chart-metric-title').textContent='ASI · '+metricName(state.sort);
 renderMetricBenchmarks();
 $('#chart-count').textContent=scored.length+' '+t('ranked models','个模型参与排名');
 $$('[data-chart-metric]').forEach(el=>{el.classList.toggle('active',el.dataset.chartMetric===state.sort);el.setAttribute('aria-pressed',el.dataset.chartMetric===state.sort)});
 $('#chart-direction').textContent=state.desc?t('Score ↓','分数 ↓'):t('Score ↑','分数 ↑');
 $('#score-chart').innerHTML=scored.length?`<div class="chart-scroll" tabindex="0" aria-label="${t('Model scores; scroll horizontally on small screens','模型分数图；窄屏可左右滚动')}"><div class="chart-canvas" style="--bar-count:${scored.length};min-width:${Math.max(360,scored.length*60+50)}px"><div class="chart-grid" aria-hidden="true">${[100,80,60,40,20,0].map(n=>`<div style="top:${100-n}%"><span>${n}</span></div>`).join('')}</div><div class="chart-columns">${scored.map(m=>{const b=modelBrand(m);return `<button class="chart-column ${state.model===m.id?'current':''}" data-chart-model="${m.id}" style="--brand:${b.color}" aria-label="${esc(m.name+' · '+brandName(b)+' · '+metricName(state.sort)+' '+fmt(metricValue(m,state.sort)))}" aria-pressed="${state.model===m.id}" aria-describedby="chart-detail"><span class="bar-track"><span class="score-bar" style="height:${metricValue(m,state.sort)}%"><strong class="bar-value">${fmt(metricValue(m,state.sort))}</strong></span></span><span class="chart-model-label">${brandLogo(b)}<b>${esc(m.name)}</b><small>${esc(brandName(b))}</small><span class="chart-rank">${chartRank(m)}</span></span></button>`}).join('')}</div></div></div><p class="chart-scroll-hint">${t('Swipe to compare all models →','左右滑动，查看全部模型 →')}</p>`:`<div class="chart-empty">${rows.length?t('No scores available for this metric.','暂无当前指标成绩。'):t('No matching models. Try another name.','未找到匹配模型，请尝试其他名称。')}</div>`;

 $('#data-disclosure-count').textContent=rows.length;
 $('#chart-detail').hidden=!rows.length;
 if(rows.length)updateChartDetail(rows.some(m=>m.id===state.model)?state.model:rows[0].id);
}
function updateChartDetail(id){
 const m=D.models.find(x=>x.id===id),b=modelBrand(m),el=$('#chart-detail');if(!el)return;
 el.innerHTML=`<div class="chart-detail-identity">${brandLogo(b)}<span><b>${esc(m.name)}</b><small>${esc(brandName(b))}</small></span></div>${metricDimension(state.sort)!==null?`<div class="chart-dimension-detail"><small>${metricName(state.sort)}</small><strong>${fmt(metricValue(m,state.sort))}</strong></div>`:''}<div><small>${t('Overall','总分')}</small><strong>${fmt(m.overall)}</strong></div><div><small>${t('Security','安全分')}</small><strong>${fmt(m.security)}</strong></div><div><small>${t('Helpfulness','任务能力')}</small><strong>${fmt(m.help)}</strong></div><button class="text-link" data-chart-explore="${m.id}">${t('Compare results','查看关联结果')} ↗</button>`;
}
document.addEventListener('click',e=>{
 const metric=e.target.closest('[data-chart-metric]');if(metric){state.sort=metric.dataset.chartMetric;state.desc=true;renderTable();return}
 if(e.target.closest('#chart-direction')){state.desc=!state.desc;renderTable();return}
 const bar=e.target.closest('[data-chart-model]');if(bar){choose('model',+bar.dataset.chartModel,true);return}
 const explore=e.target.closest('[data-chart-explore]');if(explore){choose('model',+explore.dataset.chartExplore,true);$('#explore').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'})}
});
document.addEventListener('pointerover',e=>{const bar=e.target.closest('[data-chart-model]');if(bar)updateChartDetail(+bar.dataset.chartModel)});
document.addEventListener('focusin',e=>{const bar=e.target.closest('[data-chart-model]');if(bar)updateChartDetail(+bar.dataset.chartModel)});

function sidebarMarkup(){return `<aside class="leaderboard-sidebar" aria-label="${t('Safety indexes','安全榜单')}"><span class="sidebar-label">${t('INDEXES','榜单')}</span><nav><a href="#leaderboard" class="index-link active" aria-current="page"><span class="index-dot" aria-hidden="true"></span><span>${t('Behavioral Safety','行为安全')}</span></a></nav></aside>`}

render();
</script></body>
